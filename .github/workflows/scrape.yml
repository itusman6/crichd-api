name: CricHD Playlist and Schedules

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright install chromium

      - name: Run scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node scrape.js
            
          echo "--- Playlist Preview ---"
          head -n 10 playlist.m3u || true
          echo "--- Schedule Preview ---"
          head -n 15 schedule.json || true

      - name: Upload Playlist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crichd-playlist
          path: playlist.m3u

      - name: Upload Schedule Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crichd-schedule
          path: schedule.json
