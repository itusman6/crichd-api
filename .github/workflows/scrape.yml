name: CricHD Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          # Install Playwright dependencies and FULL Chromium (not just headless shell)
          npx playwright install --with-deps chromium
          npx playwright install chromium

      - name: Run scraper
        env:
          RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        run: |
          # 2>&1 captures errors. We pipe to playlist.m3u.
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node scrape.js > playlist.m3u 2>&1 || (cat playlist.m3u && exit 1)
          
          echo "--- Playlist Preview ---"
          head -n 10 playlist.m3u
          echo "------------------------"
          
          if grep -q "Error:" playlist.m3u; then
            echo "Scraper failed. Check error output above."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: playlist.m3u
