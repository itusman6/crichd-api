name: CricHD Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable unzip wget

      - name: Download NullFlare Turnstile Solver
        run: |
          # NullFlare Extension ID: dfmkjkikfljendhmfnlflfbfjabdbhbk
          wget -O nullflare.crx "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=130.0&acceptformat=crx2,crx3&x=id%3Ddfmkjkikfljendhmfnlflfbfjabdbhbk%26uc"
          unzip -o nullflare.crx -d nullflare-solver || true
          if [ ! -f "nullflare-solver/manifest.json" ]; then
            echo "ERROR: NullFlare extraction failed."
            exit 1
          fi
          echo "NullFlare extracted."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright install chromium

      - name: Run scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node scrape.js

      - uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: playlist.m3u

      - uses: actions/upload-artifact@v4
        with:
          name: schedule
          path: schedule.json
