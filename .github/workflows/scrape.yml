name: CricHD Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip wget

      - name: Download Raptor Turnstile Solver
        run: |
          wget -O turnstile.crx "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=130.0&acceptformat=crx2,crx3&x=id%3Dijmhjekchmipnifjiahkapifokdffffo%26uc"
          unzip -o turnstile.crx -d turnstile-solver || true
          if [ ! -f "turnstile-solver/manifest.json" ]; then
            echo "ERROR: Turnstile solver extraction failed."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright install chromium

      - name: Run scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node scrape.js

      - name: Commit and Push Playlist
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u
          git commit -m "Update playlist.m3u [skip ci]" || echo "No changes to commit"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: playlist.m3u
