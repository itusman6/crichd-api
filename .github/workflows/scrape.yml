name: Generate CricHD Playlist

on:
  schedule:
    # Runs automatically every 4 hours to keep expiring tokens fresh
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install

      - name: Install Playwright Chromium Browsers
        run: |
          npx playwright install chromium

      - name: Run Scraper Script
        run: |
          node scrape.js

      - name: Verify Playlist Generation
        run: |
          if [ ! -f playlist.m3u ]; then
            echo "Error: playlist.m3u was not generated!"
            exit 1
          fi
          echo "--- Preview of Generated Playlist ---"
          head -n 20 playlist.m3u
          echo "-------------------------------------"

      - name: Upload Playlist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u-playlist
          path: playlist.m3u
          retention-days: 3
