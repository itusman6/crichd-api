name: CricHD Playlist and Schedules

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Increased timeout because we open a fresh browser for each channel

    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable unzip wget

      - name: Download Turnstile Solver Extension
        run: |
          wget -O extension.crx "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=120.0&acceptformat=crx2,crx3&x=id%3Dijmhjekchmipnifjiahkapifokdffffo%26uc"
          unzip -o extension.crx -d turnstile-solver || true
          if [ ! -f "turnstile-solver/manifest.json" ]; then
            echo "ERROR: Extraction failed."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright install chromium

      - name: Run scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node scrape.js
            
          echo "--- Playlist Preview ---"
          head -n 10 playlist.m3u || true

      - name: Upload Playlist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crichd-playlist
          path: playlist.m3u

      - name: Upload Schedule Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crichd-schedule
          path: schedule.json
