name: CricHD Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable unzip wget

      - name: Download Turnstile Solver Extension
        run: |
          # Download the extension from Chrome Web Store (using a crx downloader)
          wget -O extension.crx "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=120.0&acceptformat=crx2,crx3&x=id%3Dijmhjekchmipnifjiahkapifokdffffo%26uc"
          unzip extension.crx -d turnstile-solver

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node scrape.js
            
          echo "--- Playlist Preview ---"
          head -n 10 playlist.m3u || true

      - name: Upload Playlist
        uses: actions/upload-artifact@v4
        with:
          name: crichd-playlist
          path: playlist.m3u

      - name: Upload Schedule
        uses: actions/upload-artifact@v4
        with:
          name: crichd-schedule
          path: schedule.json
