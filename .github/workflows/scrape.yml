name: CricHD Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip wget

      - name: Download Raptor Turnstile Solver
        run: |
          # Raptor Turnstile Solver extension ID (from your previous code)
          # You need to find the correct CRX URL for this extension
          # For now, using the one from your earlier working attempt
          wget -O turnstile.crx "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=130.0&acceptformat=crx2,crx3&x=id%3Dijmhjekchmipnifjiahkapifokdffffo%26uc"
          unzip -o turnstile.crx -d turnstile-solver || true
          if [ ! -f "turnstile-solver/manifest.json" ]; then
            echo "ERROR: Turnstile solver extraction failed."
            exit 1
          fi
          echo "Turnstile solver extracted."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright install chromium

      - name: Run scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node scrape.js

      - uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: playlist.m3u

      - uses: actions/upload-artifact@v4
        with:
          name: schedule
          path: schedule.json
