name: CricHD Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          # CHANGED FROM npm ci TO npm install
          npm install
          npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node scrape.js > playlist.m3u
          
          echo "Streams: $(grep -c '^#EXTINF' playlist.m3u || echo 0)"

      - uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: playlist.m3u
