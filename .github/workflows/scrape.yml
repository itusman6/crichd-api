name: Generate CricHD Playlist

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Scraper Script
        env:
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
        run: node scrape.js

      - name: Verify Playlist Generation
        run: |
          if [ ! -f playlist.m3u ]; then
            echo "Error: playlist.m3u was not generated!"
            exit 1
          fi
          echo "--- Playlist Preview ---"
          head -n 25 playlist.m3u
          echo "------------------------"

      - name: Upload Playlist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u-playlist
          path: playlist.m3u
          retention-days: 3
