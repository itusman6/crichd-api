name: CricHD Playlist (Edge + rektCaptcha)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and Microsoft Edge
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip wget
          
          # Download Microsoft Edge Stable .deb
          wget -q https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_130.0.2849.46-1_amd64.deb || \
          wget -q https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_129.0.2792.89-1_amd64.deb
          
          sudo dpkg -i microsoft-edge-stable*.deb || sudo apt-get install -f -y
          
          # Verify Edge installation
          microsoft-edge --version

      - name: Download rektCaptcha Extension
        run: |
          # CRX Download URL for rektCaptcha (ID: bbdhfoclddncoaomddgkaaphcnddbpdh)
          wget -O rektcaptcha.crx "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=130.0&acceptformat=crx2,crx3&x=id%3Dbbdhfoclddncoaomddgkaaphcnddbpdh%26uc"
          unzip -o rektcaptcha.crx -d rektcaptcha || true
          
          if [ ! -f "rektcaptcha/manifest.json" ]; then
            echo "ERROR: rektCaptcha extraction failed."
            exit 1
          fi
          echo "rektCaptcha extracted successfully."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
          # We don't install msedge via playwright since we installed it manually above

      - name: Run scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node scrape.js

      - uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: playlist.m3u

      - uses: actions/upload-artifact@v4
        with:
          name: schedule
          path: schedule.json
